[package]
name = "octet-relay"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tokio.workspace = true
serde_json.workspace = true
getrandom = "0.4.3"
sha2 = "0.11.1"
httparse = "1.10.1"
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["zeroize"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
# The probe's wss:// client: names ring as rustls's crypto provider, as octet-hub does.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
