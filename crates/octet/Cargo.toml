[package]
name = "octet"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
[dependencies]
octet-tui.workspace = true
octet-core.workspace = true
octet-hub.workspace = true
tokio.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The terminal's width, so `octet pair` shows its QR code only where it fits.
crossterm = "0.29.0"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
octet-core = { workspace = true, features = ["testing"] }
octet-testkit = { workspace = true, features = ["relay"] }
libc.workspace = true
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }

[lints]
workspace = true
